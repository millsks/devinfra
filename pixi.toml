[workspace]
authors = ["Kevin Mills <millsks@gmail.com>"]
channels = ["conda-forge"]
name = "devinfra"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64"]
version = "0.1.0"

# Every validation tool this repository runs is a pinned dependency resolved from the
# committed pixi.lock. A missing tool is impossible, so no task branches on its absence.
[feature.dev.dependencies]
shellcheck = "0.11.*"
yamllint = "1.38.*"
python = "3.14.*"
ruff = "0.16.*"
mypy = "2.3.*"
pyyaml = "6.0.*"
types-pyyaml = "6.0.*"

[environments]
default = ["dev"]

# ---------------------------------------------------------------------------
# Lifecycle. Every target the Makefile exposed has an equivalent here; the
# Makefile now forwards to these. Non-trivial logic lives in scripts/, so it can
# be run standalone and tested — a Makefile recipe can be neither.
#
# pixi does not load .env into a task's environment the way `include .env` did
# for make. The container runtime still reads .env itself; the scripts that
# interpolate a value at shell level load it through scripts/lib/common.sh.
#
# No task body names a container runtime. Every one of them goes through
# ./scripts/compose.sh, which expands ${DEVINFRA_COMPOSE:-docker compose} —
# pixi.toml has no shell expansion of its own, so a task naming `docker compose`
# here would ignore that seam and run Docker whatever the environment selected.
# That is what lets the Podman CI job run these same tasks unmodified.
#
# No task body names a profile either, for the same reason: a Selection is
# resolved to its dependency closure before Compose sees it (AD-16), and a task
# cannot expand one. The five lifecycle tasks that must act on the whole stack —
# down, stop, pull, dump-logs, config — say so with DEVINFRA_SELECT_ALL=1 rather
# than with a hard-coded --profile list that a thirteenth Module would escape.
# ---------------------------------------------------------------------------
[tasks.init]
description = "Create .env from the template if it does not exist"
cmd = "./scripts/init-env.sh"

[tasks.start]
description = "Start the stack without waiting (the Selection COMPOSE_PROFILES asks for)"
depends-on = ["init"]
cmd = "./scripts/compose.sh up -d"

[tasks.up]
description = "Start the stack, wait for health, print endpoints"
depends-on = ["start", "wait", "urls"]

[tasks.up-core]
description = "Start only the core Bundle: the data layer, Keycloak, object storage and Mailpit"
depends-on = ["init"]
cmd = "./scripts/up-core.sh"

[tasks.down]
description = "Stop and remove containers, PRESERVING all data volumes"
cmd = "./scripts/compose.sh down"
env = { DEVINFRA_SELECT_ALL = "1" }

[tasks.stop]
description = "Stop containers without removing them"
cmd = "./scripts/compose.sh stop"
env = { DEVINFRA_SELECT_ALL = "1" }

[tasks.restart]
description = "Recreate the stack, preserving data"
depends-on = ["down", "up"]

[tasks.destroy]
description = "DELETE ALL DATA - remove containers and every named volume"
cmd = "./scripts/destroy.sh"

[tasks.pull]
description = "Pull newer images for every pinned tag"
cmd = "./scripts/compose.sh pull"
env = { DEVINFRA_SELECT_ALL = "1" }

[tasks.wait]
description = "Block until every container is running and every healthcheck is healthy"
cmd = "./scripts/wait-healthy.sh"

# ---------------------------------------------------------------------------
# Inspection
# ---------------------------------------------------------------------------
[tasks.ps]
description = "Show container status and health"
cmd = "./scripts/ps.sh"

[tasks.logs]
description = "Tail logs for all services, or one: pixi run logs keycloak"
args = [{ arg = "service", default = "" }]
cmd = "./scripts/logs.sh '{{ service }}'"

[tasks.dump-logs]
description = "Print a bounded, uncoloured log dump for every service (CI diagnostics)"
cmd = "./scripts/compose.sh logs --no-color --tail=200"
env = { DEVINFRA_SELECT_ALL = "1" }

[tasks.smoke]
description = "Run the end-to-end smoke test against the running stack"
cmd = "./scripts/smoke-test.sh"

[tasks.smoke-strict]
description = "Run the smoke test with a skipped service scored as a failure (what CI runs)"
cmd = "./scripts/smoke-test.sh"
env = { SMOKE_STRICT = "1" }

[tasks.urls]
description = "Print every service endpoint"
cmd = "./scripts/urls.sh"

[tasks.help]
description = "List every task with its description"
cmd = "pixi task list"

# ---------------------------------------------------------------------------
# Shells
# ---------------------------------------------------------------------------
[tasks.psql]
description = "Open a psql shell: pixi run psql keycloak"
args = [{ arg = "db", default = "" }]
cmd = "./scripts/psql.sh '{{ db }}'"

[tasks.redis-cli]
description = "Open a redis-cli shell: pixi run redis-cli 1 to select a db"
args = [{ arg = "n", default = "" }]
cmd = "./scripts/redis-cli.sh '{{ n }}'"

[tasks.mc]
description = "Open a shell with the MinIO client configured"
cmd = "./scripts/mc.sh"

# ---------------------------------------------------------------------------
# Data operations
# ---------------------------------------------------------------------------
[tasks.backup]
description = "Dump all Postgres databases to backups/"
cmd = "./scripts/backup.sh"

[tasks.restore]
description = "Restore a dump: pixi run restore backups/postgres-....sql.gz"
args = [{ arg = "file", default = "" }]
cmd = "./scripts/restore.sh '{{ file }}'"

[tasks.keycloak-reimport]
description = "Re-import the realm after editing the JSON (DESTROYS realm state)"
cmd = "./scripts/keycloak-reimport.sh"

[tasks.keycloak-export]
description = "Export the live realm back to services/keycloak/seed/"
cmd = "./scripts/keycloak-export.sh"

[tasks.token]
description = "Mint an access token: pixi run token dev dev"
args = [{ arg = "user", default = "dev" }, { arg = "password", default = "dev" }]
cmd = "./scripts/token.sh '{{ user }}' '{{ password }}'"

# One `names` argument, not one per Module: pixi task arguments are positional and fixed
# in number, so several names travel as one comma-separated value — the same spelling
# COMPOSE_PROFILES uses, which the resolver splits on commas and whitespace. With no
# argument at all the value is empty and select.sh falls back to COMPOSE_PROFILES, which
# is what makes a bare `pixi run select` print what the current .env asks for.
[tasks.select]
description = "Print the Modules a Selection resolves to: pixi run select postgres,redis"
args = [{ arg = "names", default = "" }]
cmd = "./scripts/select.sh '{{ names }}'"

[tasks.config]
description = "Render the fully resolved compose configuration"
cmd = "./scripts/compose.sh config"
env = { DEVINFRA_SELECT_ALL = "1" }

# ---------------------------------------------------------------------------
# Validation
# ---------------------------------------------------------------------------
[tasks.lint-compose]
description = "Validate the compose configuration for every Selection: each Module, each Bundle, and every Module at once"
cmd = "./scripts/lint-compose.sh"

[tasks.lint-config]
description = "Assert the rendered config binds locally, collides on no host port, pins every image, shares one logging policy, every service carries its own Module profile and no profile the x-bundles registry does not register, every registered Bundle is joined and dependency-closed, and every module stanza names a root-declared identifier only, redeclaring no resource the root declares with keys"
cmd = "python scripts/assert_config.py"

[tasks.lint-pins]
description = "Assert every image pin agrees between .env.example and the compose fallbacks, module files included"
cmd = "python scripts/assert_pins.py"

[tasks.lint-renovate]
description = "Assert the Renovate configuration's own regexes still detect every image pin"
cmd = "python scripts/assert_renovate.py"

[tasks.lint-shell]
description = "shellcheck every shell script in the repository, the git hooks included"
cmd = "shellcheck scripts/**/*.sh services/**/*.sh .githooks/*"

[tasks.lint-yaml]
description = "yamllint the compose files, the shared fragment, the CI workflow and every service YAML config"
cmd = "yamllint --strict -c .yamllint.yaml .yamllint.yaml compose.yaml common/**/*.y*ml services/**/*.y*ml .github/workflows/*.y*ml"

[tasks.lint-json]
description = "Validate every JSON config parses"
cmd = "python scripts/lint_json.py renovate.json services/**/*.json"

[tasks.lint-python]
description = "ruff and mypy over the repository's own Python"
cmd = "ruff format --check scripts && ruff check scripts && mypy scripts"

[tasks.test]
description = "Prove every lint check fails on a real defect and passes on a clean file"
cmd = "python scripts/lint_selftest.py"

[tasks.lint]
description = "Run every validation check"
depends-on = ["lint-compose", "lint-config", "lint-pins", "lint-renovate", "lint-shell", "lint-yaml", "lint-json", "lint-python"]

[tasks.ci]
description = "The done-gate: every check this repository needs"
depends-on = ["lint", "test"]

# The stack half of CI, invoked as one named task so the workflow never becomes a
# second definition of what CI runs. The Selection comes from the environment, which
# the workflow sets explicitly; .env ships a default that resolves to every Module
# too, and the self-test pins both.
[tasks.ci-stack]
description = "Start the stack, wait for health and run the strict smoke suite"
depends-on = ["init", "start", "wait", "smoke-strict"]

# The second half of the same gate, and the only thing that proves provisioning is
# provisioning: `down` removes the containers and keeps the volumes, so a dashboard or a
# datasource that only exists because it was written into a volume on first init survives
# this, while one that is re-read from its read-only bind mount is re-read here. Composed
# entirely of tasks ci-stack already runs, so there is no second definition of what a
# cycle is. Run after ci-stack, never instead of it — the first run is what leaves a
# started stack for `down` to take away.
[tasks.ci-stack-cycle]
description = "Cycle the stack and re-run the strict smoke suite: proves nothing checked depends on first-init volume state"
depends-on = ["down", "start", "wait", "smoke-strict"]

# ---------------------------------------------------------------------------
# Commit-time checks. The hooks in .githooks/ carry no logic and name no tool:
# each is an `exec pixi run <task>` over a task declared here, so a commit is
# checked by the same task definitions, at the same pinned versions, that the
# hosted run uses. `precommit` is a strict subset of `lint` — lint-compose and
# lint-config need a container runtime, and a hook that cannot run while Docker
# is down trains the --no-verify reflex that makes hooks worthless.
# See docs/adr/0011-commit-time-checks-are-git-hooks-invoking-pixi-tasks.md.
# ---------------------------------------------------------------------------
[tasks.bootstrap]
description = "Install the git hooks in this clone by pointing core.hooksPath at .githooks/"
cmd = "./scripts/bootstrap.sh"

[tasks.precommit]
description = "The offline half of lint: what the pre-commit hook runs"
depends-on = ["lint-shell", "lint-yaml", "lint-json", "lint-pins", "lint-renovate", "lint-python"]

[tasks.commit-msg]
description = "Check a commit message file against Conventional Commits"
args = [{ arg = "file", default = "" }]
cmd = "python scripts/check_commit_msg.py '{{ file }}'"

# ---------------------------------------------------------------------------
# Podman. The runtime is selected by where the Docker API lives, not by a second
# set of task bodies: ci-stack-podman reuses init/start/wait/smoke-strict exactly
# as ci-stack does, and the containers they create are then proved to be Podman's.
# See docs/adr/0009-podman-is-verified-through-the-docker-compatible-socket.md.
# ---------------------------------------------------------------------------
[tasks.ci-podman-socket]
description = "Stop Docker and enable Podman's API socket (CI, or an explicit opt-in)"
cmd = "./scripts/podman-socket.sh"

[tasks.assert-podman]
description = "Prove Podman itself reports every container this run created"
cmd = "./scripts/assert-podman.sh"

[tasks.ci-stack-podman]
description = "The stack half of CI again, against Podman, proved to have run there"
depends-on = ["ci-podman-socket", "init", "start", "wait", "smoke-strict", "assert-podman"]
