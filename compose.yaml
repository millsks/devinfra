# devinfra — local development infrastructure stack
#
# Every stateful service writes to a named volume, so `docker compose down`
# followed by `docker compose up` preserves data. Only `down -v` destroys it.
#
# Profiles:
#   (none)         postgres, redis, keycloak, minio, mailpit  — always started
#   admin          pgadmin, redisinsight, flower
#   observability  otel-collector, prometheus, loki, tempo, grafana
#
# Select profiles with COMPOSE_PROFILES in .env, or `--profile <name>` per run.
#
# Extraction is complete: every service lives in services/<name>/ with its config
# and seed data beside it, and this file assembles them through the `include:`
# list below. That list is the record of what the stack runs — this file declares
# no services of its own, and a service added back here would be invisible to
# every per-module check. The shared restart/logging/networks fragment lives in
# common/base.yaml and reaches each module through `extends`; the `x-defaults`
# anchor that used to duplicate it here is gone, because a YAML anchor cannot
# cross an `include` boundary and nothing is left in this file to read it.

name: ${COMPOSE_PROJECT_NAME:-devinfra}

# ---------------------------------------------------------------------------
# Modules — one file per extracted service, reassembled here
# ---------------------------------------------------------------------------
include:
  - ./services/flower/compose.yaml
  - ./services/grafana/compose.yaml
  - ./services/keycloak/compose.yaml
  - ./services/loki/compose.yaml
  - ./services/mailpit/compose.yaml
  - ./services/minio/compose.yaml
  - ./services/otel-collector/compose.yaml
  - ./services/pgadmin/compose.yaml
  - ./services/postgres/compose.yaml
  - ./services/prometheus/compose.yaml
  - ./services/redis/compose.yaml
  - ./services/redisinsight/compose.yaml
  - ./services/tempo/compose.yaml

# ---------------------------------------------------------------------------
# Named volumes — everything stateful lands here and survives `down`
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  keycloak-data:
  minio-data:
  mailpit-data:
  pgadmin-data:
  redisinsight-data:
  flower-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  devinfra:
    name: devinfra
    driver: bridge
