# Continuous verification for the devinfra stack.
#
# Every job's work is a `pixi run <task>` invocation. No tool version is named
# here and nothing is installed with a package manager: the versions come from
# the committed pixi.lock, so the checks that run here are byte-for-byte the
# ones a contributor runs locally. A workflow that declared its own versions
# would be a second, drifting definition of what CI checks.
#
# Every job is time-bounded. `timeout-minutes` enforces the 15-minute rule
# rather than measuring it: a breach cancels the job and turns the run red,
# which is the signal to tier the matrix — never to drop a check.
#
# Three jobs: the static gate, the stack under Docker, and the same stack under
# Podman. The two stack jobs run the same pixi tasks over the same Selection; the
# only difference is where the Docker API lives.
name: CI

# No job needs more than the checkout, so the token is read-only and is not
# left on disk for later steps to pick up.
permissions:
  contents: read

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded pull-request run proves nothing about the head commit. A push to
# main is never superseded: cancelling it would leave that commit permanently
# unverified, which is exactly what this workflow exists to prevent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    # The static gate. It starts nothing, but lint-compose and lint-config both
    # ask the container runtime to resolve the model, so Docker is required here
    # too — it is the stack that is not started, not the runtime that is unused.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pixi
        # The action is pinned; the tool versions it installs come from pixi.lock.
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Run the done-gate
        run: pixi run ci

  stack:
    name: stack
    runs-on: ubuntu-latest
    # Runs in parallel with validate, so the run's wall clock is the slower job
    # rather than the sum of both.
    timeout-minutes: 15
    env:
      # Stated here rather than inherited from .env so the workflow says plainly
      # which services this job brings up. Three Bundles that between them cover
      # every Module — the same value .env.example ships. The self-test asserts
      # this Selection resolves to every Module, so a Module added later turns
      # the gate red until CI starts it too.
      COMPOSE_PROFILES: core,admin,observability
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Start the stack, wait for health, run the strict smoke suite
        run: pixi run ci-stack

      # The same suite again over a stack that has been taken down and brought back.
      # Containers go, volumes stay, so anything that passed above only because it was
      # written into a volume on first init fails here — which is the difference between
      # a provisioned dashboard and one somebody saved. A step rather than a job: the
      # cycle is only meaningful against the stack the step above left running.
      - name: Cycle the stack and run the strict smoke suite again
        run: pixi run ci-stack-cycle

      # The backup round trip, over the stack the two steps above left running. A step
      # rather than a fourth job for the same reason the cycle is one: it is only
      # meaningful against a stack that is already up and populated, and it shares this
      # job's 15-minute budget. It plants markers, destroys every volume, restores and
      # reads the markers back before running the strict suite again.
      - name: Round-trip the backup and run the strict smoke suite again
        run: pixi run ci-stack-restore

      # Diagnostics, not work: they run only after the step above has already
      # failed the job, and cannot turn a red run green.
      - name: Container status
        if: failure()
        run: pixi run ps

      - name: Container logs
        if: failure()
        run: pixi run dump-logs

  stack-podman:
    name: stack-podman
    # Pinned, not ubuntu-latest: the label moves to 24.04's successor with a
    # different Podman and a different Compose major, and this job's whole value
    # is that it says which runtime versions the stack was proved against.
    # ubuntu-24.04 ships Podman and the Compose plugin preinstalled, so nothing
    # here installs anything.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The same three Bundles the Docker job starts. The self-test pins this to
      # resolve to every Module, so no service is silently excluded from the
      # Podman run — an exclusion has to be written here, with its reason in
      # the README.
      COMPOSE_PROFILES: core,admin,observability
      # This is the whole runtime switch. The Compose client is the same stock
      # binary the `stack` job uses; only the API it talks to changes, so
      # depends_on ordering, health gating and `ps --format` stay identical
      # between the two jobs. ci-podman-socket also stops Docker, so there is no
      # daemon left to fall back to.
      DOCKER_HOST: unix:///run/podman/podman.sock
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: true

      - name: Start the stack under Podman and prove it ran there
        run: pixi run ci-stack-podman

      - name: Container status
        if: failure()
        run: pixi run ps

      - name: Container logs
        if: failure()
        run: pixi run dump-logs
