# Image update proposals for the devinfra stack.
#
# This workflow only *proposes*. Every pull request it opens is validated by
# ci.yml exactly like a human's: lint-pins proves the .env.example declaration
# and the compose.yaml fallback moved together, and the two stack jobs prove the
# new image actually starts and passes the strict smoke suite. Nothing here
# merges anything.
#
# It is deliberately not reachable by push or pull_request. A second workflow on
# those events would be a second definition of what a change is checked by, and
# ci.yml is the only one this repository has. scripts/lint_selftest.py asserts
# that split rather than leaving it to review.
#
# The token is RENOVATE_TOKEN, not the workflow's own GITHUB_TOKEN. A pull
# request opened with GITHUB_TOKEN triggers no `pull_request` workflow, so the
# bot's own pull requests would arrive with no checks at all — the one thing
# this story exists to prevent. Supply a fine-grained personal access token, or
# a GitHub App installation token, with contents:write, pull-requests:write and
# issues:write (the last for the dependency dashboard) on this repository. The
# bot cannot authenticate without it, so nothing is proposed until it is set.
name: Renovate

# Renovate authenticates with its own token; this one needs nothing but the
# checkout, so it stays read-only.
permissions:
  contents: read

'on':
  schedule:
    # Weekly, early Monday UTC. Off the hour, because the top of the hour is
    # when every other scheduled job on the platform also wakes up.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# One bot run at a time. A second run against the same repository would race the
# first over the same branches.
concurrency:
  group: renovate-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    name: renovate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Propose image updates
        # The action ships Renovate in a container, so nothing is installed here
        # and no Node version is named. `@v46` is a major pin, and a major tag is
        # itself mutable — the publisher re-points it, so this fixes the major
        # the bot runs at, not the exact code. That is the trade taken on
        # purpose: `enabledManagers` excludes the github-actions manager, so
        # nothing here watches action refs, and a pinned SHA would rot silently
        # while a major tag keeps receiving fixes.
        uses: renovatebot/github-action@v46
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
