# Grafana — the single UI over Prometheus, Loki and Tempo.
# Profile: observability.
#
# A Module. The rules every Module holds are spelled out once in
# services/postgres/compose.yaml and in the 2026-09-07 amendment to
# docs/adr/0004-volume-names-are-frozen.md; `lint-config` enforces them.
#
# Two directories, and they are not the same kind of thing: conf/provisioning/ is
# configuration read at startup, while dashboards/ is a live drop-zone Grafana
# re-scans every 30 seconds.

# What this Module publishes, keyed by the variable that sets the host port.
# `lint-config` reconciles this against the ports the file actually publishes, so
# a new port with no entry here fails the build. See docs/adr/0012.
x-endpoints:
  GRAFANA_PORT:
    url: http://localhost:${GRAFANA_PORT:-3000}
    description: Grafana UI and HTTP API over Prometheus, Loki and Tempo.

# What this Module consumes from another, named by the provider's own endpoint
# keys. Every entry must have a matching `depends_on` edge (ADR 0002).
x-requires:
  prometheus:
    - PROMETHEUS_PORT
  loki:
    - LOKI_PORT
  tempo:
    - TEMPO_PORT

services:
  grafana:
    extends:
      file: ../../common/base.yaml
      service: defaults
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.1}
    container_name: devinfra-grafana
    profiles: [grafana, observability]
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Local convenience only: skips the login screen entirely.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor,traceQLStreaming,metricsSummary
      GF_LOG_LEVEL: warn
      # Referenced by conf/provisioning/datasources/datasources.yaml.
      POSTGRES_USER: ${POSTGRES_USER:-devinfra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devinfra}
      POSTGRES_DB: ${POSTGRES_DB:-devinfra}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./conf/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      # The image carries /bin/sh and wget; /api/health is Grafana's own readiness
      # endpoint and reports the database check with it.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  grafana-data:
