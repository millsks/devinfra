# Mailpit — catches every outbound email, including Keycloak's.
#
# Pulled into the model by the `include:` list in the root compose.yaml. Shared
# configuration arrives through `extends` rather than a YAML anchor: anchors are
# document-scoped and cannot cross a file boundary.
#
# No config or seed files: the volume is the whole of this module's state.
# `project_directory` is never used in a module file; should this one ever gain a
# relative path, it is written against *this* directory.
#
# The `volumes:` stanza below carries the identifier and nothing else. Driver keys
# live in the root compose.yaml, which wins on every key it sets explicitly; a
# module adding one would silently win instead.
#
# There is deliberately no `networks:` stanza here, and adding one back breaks CI.
# Compose v2 refuses an `include` in which a module declares a top-level resource
# the root declares *with keys* — `networks.devinfra conflicts with imported
# resource`, exit 15. The root's `networks: devinfra:` carries `name:` and
# `driver:`, so no module may name it; its `volumes: mailpit-data:` is bare, so a
# bare redeclaration here is accepted. The service still joins the network: it
# inherits `networks: [devinfra]` from common/base.yaml through `extends`. See the
# 2026-09-07 amendment in docs/adr/0004-volume-names-are-frozen.md.

# What this Module publishes, keyed by the variable that sets the host port.
# `lint-config` reconciles this against the ports the file actually publishes, so
# a new port with no entry here fails the build. See docs/adr/0012.
x-endpoints:
  MAILPIT_SMTP_PORT:
    url: smtp://localhost:${MAILPIT_SMTP_PORT:-1025}
    description: SMTP sink — accepts any credentials, stores every message.
  MAILPIT_UI_PORT:
    url: http://localhost:${MAILPIT_UI_PORT:-8025}
    description: Mailpit web UI and REST API (/api/v1/messages), plus /readyz.

services:
  mailpit:
    extends:
      file: ../../common/base.yaml
      service: defaults
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31.1}
    container_name: devinfra-mailpit
    profiles: [mailpit]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${BIND_ADDRESS:-127.0.0.1}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8025/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mailpit-data:
