# Keycloak 26 — OpenID Connect provider.
#
# Pulled into the model by the `include:` list in the root compose.yaml. Shared
# configuration arrives through `extends` rather than a YAML anchor: anchors are
# document-scoped and cannot cross a file boundary.
#
# `depends_on` names postgres and mailpit, which live in other module files.
# That resolves because `include` assembles one model before dependencies are
# checked — a dependency edge is not scoped to the file that declares it. See
# docs/adr/0002-dependency-validation-is-compose-native.md.
#
# Every relative path here is resolved against *this* directory, not the project
# directory, so `./seed` is the module's own. `project_directory` is deliberately
# not used — it would re-base every relative path in the file.
#
# The `volumes:` stanza below carries the identifier and nothing else. Driver keys
# live in the root compose.yaml, which wins on every key it sets explicitly; a
# module adding one would silently win instead.
#
# There is deliberately no `networks:` stanza here, and adding one back breaks CI.
# Compose v2 refuses an `include` in which a module declares a top-level resource
# the root declares *with keys* — `networks.devinfra conflicts with imported
# resource`, exit 15. The root's `networks: devinfra:` carries `name:` and
# `driver:`, so no module may name it; its `volumes: keycloak-data:` is bare, so a
# bare redeclaration here is accepted. The service still joins the network: it
# inherits `networks: [devinfra]` from common/base.yaml through `extends`. See the
# 2026-09-07 amendment in docs/adr/0004-volume-names-are-frozen.md.
services:
  keycloak:
    extends:
      file: ../../common/base.yaml
      service: defaults
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.3}
    container_name: devinfra-keycloak
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_PORT:-8080}:8080"
      - "${BIND_ADDRESS:-127.0.0.1}:${KEYCLOAK_MGMT_PORT:-9000}:9000"
    environment:
      # --- Bootstrap admin (console at /admin) ---
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # --- Persistence: Postgres, not the default in-memory H2 ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-devinfra}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-devinfra}

      # --- HTTP / hostname ---
      # Fixing the hostname keeps the OIDC issuer stable at
      # http://localhost:8080/realms/<realm>, which matters because clients
      # reject tokens whose issuer does not match their discovery document.
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      # --- Observability endpoints on the management port (9000) ---
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Substituted into seed/devinfra-realm.json at import.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-devinfra-local-secret}
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./seed:/opt/keycloak/data/import:ro
    # start-dev: no TLS, no hostname strictness, caching disabled. Never use in
    # production. --import-realm only creates realms that do not already exist,
    # so edits to the JSON need `make keycloak-reimport`.
    command: ["start-dev", "--import-realm"]
    healthcheck:
      # The Keycloak image has bash but no curl/wget/nc, so this drives a raw
      # HTTP request over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

volumes:
  keycloak-data:
