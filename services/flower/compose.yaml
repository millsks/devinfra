# Flower — Celery monitoring UI over the Redis broker. Profile: admin.
#
# A Module. The rules every Module holds are spelled out once in
# services/postgres/compose.yaml and in the 2026-09-07 amendment to
# docs/adr/0004-volume-names-are-frozen.md; `lint-config` enforces them.

# What this Module publishes, keyed by the variable that sets the host port.
# `lint-config` reconciles this against the ports the file actually publishes, so
# a new port with no entry here fails the build. See docs/adr/0012.
x-endpoints:
  FLOWER_PORT:
    url: http://localhost:${FLOWER_PORT:-5555}
    description: Flower UI and REST API over the Celery broker.

# What this Module consumes from another, named by the provider's own endpoint
# keys. Every entry must have a matching `depends_on` edge (ADR 0002).
x-requires:
  redis:
    - REDIS_PORT

services:
  # Celery monitoring. Runs without any worker present — it will simply show an
  # empty cluster until a worker on your host connects to the same broker.
  flower:
    extends:
      file: ../../common/base.yaml
      service: defaults
    image: mher/flower:${FLOWER_VERSION:-2.1.0}
    container_name: devinfra-flower
    profiles: [admin]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FLOWER_PORT:-5555}:5555"
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-devinfra}@redis:6379/${REDIS_BROKER_DB:-1}
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-devinfra}@redis:6379/${REDIS_BACKEND_DB:-2}
      FLOWER_UNAUTHENTICATED_API: "true"
      FLOWER_PURGE_OFFLINE_WORKERS: "60"
    volumes:
      - flower-data:/data
    command: ["celery", "flower", "--persistent=True", "--db=/data/flower.db", "--state_save_interval=10000"]
    healthcheck:
      # The image carries /bin/sh and wget; /healthcheck is Flower's own liveness
      # endpoint and answers before any worker has connected.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5555/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  flower-data:
