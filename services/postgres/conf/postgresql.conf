# Development-tuned PostgreSQL 17 configuration.
#
# Mounted read-only and loaded via `-c config_file=`. Sized for a laptop, not a
# production server: verbose logging, generous statement tracking, and durability
# relaxed just enough to keep test suites fast without risking the data volume.

listen_addresses = '*'

# --- Memory ----------------------------------------------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

# --- Connections -----------------------------------------------------------
max_connections = 200

# --- Write-ahead log -------------------------------------------------------
# synchronous_commit=off trades a few hundred ms of committed-transaction
# durability on hard crash for a large write throughput win. Acceptable for
# local development; never do this in production.
wal_level = logical
synchronous_commit = off
max_wal_size = 2GB
min_wal_size = 128MB

# --- Query statistics ------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_io_timing = on
track_functions = pl

# --- Logging ---------------------------------------------------------------
# Log every statement slower than 200ms plus all DDL, so slow-query hunting
# needs no config change mid-session.
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 200ms
log_statement = 'ddl'
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Locale / timezone -----------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
