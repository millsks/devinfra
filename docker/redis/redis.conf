# Redis 8 configuration for local development.
#
# Serves three roles at once, separated by logical database:
#   db 0 -> application cache
#   db 1 -> Celery broker
#   db 2 -> Celery result backend
#
# requirepass is NOT set here; compose passes it as a command-line flag so the
# password stays in .env. CLI flags override this file.

bind 0.0.0.0
protected-mode no
port 6379

# --- Persistence -----------------------------------------------------------
# Both RDB snapshots and AOF are enabled. AOF (everysec) is what actually makes
# queued Celery tasks survive `docker compose down`; RDB gives fast restarts.
dir /data

save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# --- Memory ----------------------------------------------------------------
# IMPORTANT: noeviction is deliberate. This instance is a Celery broker as well
# as a cache; allkeys-lru would let Redis silently evict queued tasks and
# unclaimed results under memory pressure, which looks like tasks vanishing.
# If you need an evicting cache, run a second Redis rather than changing this.
maxmemory 512mb
maxmemory-policy noeviction

# --- Keyspace notifications ------------------------------------------------
# Ex = expired-key events, needed by cache-invalidation listeners and some
# Celery monitoring tools.
notify-keyspace-events Ex

# --- Slow query log --------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# --- Logging ---------------------------------------------------------------
loglevel notice
